<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Four Strands: the Money DNA board game. Rags or riches: the money decisions that make or break you.">
<meta name="theme-color" content="#0F1B2D">
<base href="/fourstrands/">
</head>
<body style="margin:0">
<title>Four Strands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap">
<style>
/* One phone-sized column; every screen fits 375×667 with no scrolling (long lists paginate). Bottom sheets for Money, Pockets, Strands, Coins and Menu. Single dark look, same tokens as the Money DNA quiz. */
:root {
  --ink: #0F1B2D; --surface: #17263D; --raised: #22344F; --line: #2C4060;
  --text: #F2F5F9; --soft: #C9D4E3; --muted: #A9B6C8; --dim: #8796AB;
  --amber: #F5B841; --coral: #F26B4B; --teal: #3CC3A8; --blue: #6F9BF2; --violet: #A98BF0;
  --good: #3CC3A8; --bad: #F26B4B;
  --display: 'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif;
  --body: 'DM Sans', 'Helvetica Neue', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(130% 90% at 50% 35%, #1B2B45 0%, #0F1B2D 55%, #080F1C 100%) fixed var(--ink); color: var(--text); font-family: var(--body); font-size: 14px; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

#app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
.grow { flex: 1; min-height: 0; }
.kicker { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--k, var(--amber)); }
.h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance; }
.lead { margin: 0; font-size: 15px; line-height: 1.5; color: var(--soft); }
.fine { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.num { font-variant-numeric: tabular-nums; }

.btn { min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s, background .2s; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #1A1404; }
.btn.primary:disabled { background: var(--raised); border-color: var(--raised); color: var(--dim); }
.btn:disabled { opacity: .6; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 40px; padding: 0 12px; font-size: 13px; border-radius: 11px; }
.btn.wide { width: 100%; }
.btn svg { width: 18px; height: 18px; }
.fine.mid { text-align: center; }
.gbtn { display: flex; justify-content: center; min-height: 44px; color-scheme: normal; }
.linkbtn { min-height: 44px; border: 0; background: none; color: var(--soft); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 0 4px; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.chip { font-size: 12px; font-weight: 700; color: var(--soft); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip svg { width: 14px; height: 14px; }
.chip.flame { color: var(--amber); }

/* welcome */
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 17px; }
.brand i { width: 22px; height: 22px; border-radius: 7px; background: conic-gradient(var(--coral) 0 25%, var(--amber) 0 50%, var(--teal) 0 75%, var(--blue) 0); flex: none; }
.hero { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(44px, 14vw, 60px); line-height: .92; letter-spacing: -0.035em; }
.hero span { display: block; color: var(--amber); }
.tagline { margin: 0; font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.3; text-wrap: balance; }
.helix { width: 100%; height: auto; display: block; max-width: 100%; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.facts div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; font-size: 12.5px; color: var(--soft); line-height: 1.35; }
.facts b { display: block; font-family: var(--display); font-size: 16px; color: var(--text); }

/* intake */
.dots { display: flex; gap: 4px; }
.dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.dots i.on { background: var(--amber); }
.opts2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opts1 { display: grid; gap: 8px; }
.pick { min-height: 50px; border-radius: 13px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; text-align: left; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; line-height: 1.25; }
.pick.slim { min-height: 44px; }
.pick.sel { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--surface)); }
.pick .tick { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--dim); flex: none; display: grid; place-items: center; }
.pick.sel .tick { background: var(--amber); border-color: var(--amber); color: #1A1404; }
.pick .tick svg { width: 14px; height: 14px; }
.typegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.typecard { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.typecard.sel { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--ink)); }
.typecard img { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--c); object-fit: cover; }
.typecard b { font-family: var(--display); font-size: 15px; line-height: 1.1; }
.typecard span { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.typecard em { font-style: normal; font-size: 11px; font-weight: 700; color: var(--c); letter-spacing: .04em; text-transform: uppercase; }
.field input { width: 100%; min-height: 52px; border-radius: 13px; border: 1.5px solid var(--line); background: var(--surface); padding: 0 16px; font-size: 18px; }
.upload { position: relative; overflow: hidden; }
.upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.rscore { display: grid; grid-template-columns: 100px 1fr 40px; gap: 8px; align-items: center; font-size: 12.5px; }
.rscore span { color: var(--c); font-weight: 700; }
.rscore em { font-style: normal; text-align: right; color: var(--soft); font-variant-numeric: tabular-nums; }
.amtrow { display: flex; flex-direction: column; gap: 5px; }
.amtrow b { font-size: 13.5px; }
.amts { display: grid; gap: 5px; }
.amts button { min-height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 12px; padding: 0 2px; }
.amts button.sel { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--surface)); }
.agebox { display: flex; align-items: center; justify-content: center; gap: 18px; }
.agebox b { font-family: var(--display); font-size: 64px; min-width: 110px; text-align: center; font-variant-numeric: tabular-nums; }
.agebox .iconbtn { width: 56px; height: 56px; font-size: 26px; font-weight: 700; }

/* mirror and summaries */
.lines { display: flex; flex-direction: column; gap: 6px; font-variant-numeric: tabular-nums; }
.lines div { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--soft); }
.lines div b { color: var(--text); }
.lines .tot { border-top: 1px solid var(--line); padding-top: 7px; }
.lines .pos { color: var(--good); }
.lines .neg { color: var(--bad); }
.panel { border-radius: 16px; background: var(--surface); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.who { display: flex; gap: 12px; align-items: center; min-width: 0; }
.who img { width: 46px; height: 46px; border-radius: 50%; border: 2.5px solid var(--c); object-fit: cover; flex: none; }
.who b { font-family: var(--display); font-size: 19px; line-height: 1.05; display: block; }
.who span { font-size: 12.5px; color: var(--c); font-weight: 700; }
.ladder { display: flex; flex-direction: column; gap: 8px; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 10px 12px; }
.srow b { font-family: var(--display); font-size: 15px; color: var(--c); }
.srow span { font-size: 12.5px; color: var(--soft); line-height: 1.35; grid-column: 1 / -1; }
.srow em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--muted); text-align: right; }
.tag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: 2px; }
.tag.strong { background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c); }
.tag.blind { background: color-mix(in srgb, var(--violet) 22%, transparent); color: var(--violet); }
.bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c, var(--amber)); border-radius: 3px; transition: width .4s; }

/* home */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.top .row { gap: 6px; }
.hello { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.hello .date { font-size: 12.5px; color: var(--muted); }
.hello .date b { display: block; font-family: var(--display); font-size: 20px; color: var(--text); }
.worth { text-align: right; font-size: 12px; color: var(--muted); }
.worth b { display: block; font-family: var(--display); font-size: 20px; color: var(--text); font-variant-numeric: tabular-nums; }
.strandgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border: 0; background: none; padding: 0; text-align: left; }
.st { border-radius: 13px; background: var(--surface); border: 1px solid var(--line); padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.st.mine { border-color: color-mix(in srgb, var(--c) 55%, var(--line)); }
.stn { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.stn b { font-family: var(--display); font-size: 15px; color: var(--c); }
.stn em { font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.stv { font-size: 11.5px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dreambox { border-radius: 13px; background: var(--surface); border: 1px solid var(--line); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.dreambox .between span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dreambox b { font-size: 13.5px; }
.nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.nav button { min-height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 700; color: var(--soft); }
.nav svg { width: 19px; height: 19px; }
.today { border-radius: 16px; padding: 10px 12px; background: radial-gradient(120% 120% at 0% 0%, color-mix(in srgb, var(--amber) 16%, var(--surface)), var(--surface) 70%); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.pips { display: flex; gap: 5px; }
.pips i { flex: 1; max-width: 40px; height: 6px; border-radius: 3px; background: var(--raised); }
.pips i.on { background: var(--amber); }
.pips i.x { background: var(--violet); }
.extras { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* turn */
.weekbar { display: flex; flex-wrap: wrap; gap: 6px; }
.weekbar .chip.pos { color: var(--good); }
.weekbar .chip.neg { color: var(--bad); }
.cardv { border-radius: 18px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--k); padding: 14px; display: flex; flex-direction: column; gap: 10px; animation: rise .28s ease-out; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
.cardv h2 { margin: 0; font-family: var(--display); font-size: 22px; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance; }
.cardv p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--soft); }
.deal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.deal div { background: var(--raised); border-radius: 11px; padding: 7px 10px; display: flex; flex-direction: column; gap: 1px; font-variant-numeric: tabular-nums; }
.deal span { font-size: 11px; color: var(--muted); }
.deal b { font-size: 14px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border-radius: 14px; border: 1.5px solid var(--line); background: var(--ink); padding: 9px 13px; min-height: 54px; display: flex; flex-direction: column; justify-content: center; gap: 2px; transition: border-color .15s, transform .12s; }
.opt:hover:not(:disabled) { border-color: var(--k, var(--amber)); }
.opt:active:not(:disabled) { transform: scale(.99); }
.opt b { font-size: 14.5px; line-height: 1.25; }
.opt span { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.opt:disabled { opacity: .55; }
.opt:disabled span { color: var(--amber); }
.result { border-radius: 16px; background: var(--raised); padding: 14px; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; gap: 8px; animation: rise .28s ease-out; }
.result.good { box-shadow: inset 4px 0 0 var(--good); }
.result.bad { box-shadow: inset 4px 0 0 var(--bad); }
.news { border-radius: 14px; padding: 11px 13px; background: color-mix(in srgb, var(--c, var(--amber)) 18%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c, var(--amber)) 50%, var(--line)); font-size: 13.5px; line-height: 1.4; animation: rise .3s ease-out; }
.news b { display: block; font-family: var(--display); font-size: 16px; color: var(--c, var(--amber)); }

/* sheets */
.back { position: fixed; inset: 0; z-index: 20; background: rgba(6, 11, 20, .62); display: flex; align-items: flex-end; justify-content: center; }
.back.anim { animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-width: 480px; max-height: 96%; overflow: hidden; background: var(--surface); border-radius: 22px 22px 0 0; border-top: 4px solid var(--k, var(--amber));
  padding-top: 14px; padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 11px; }
.back.anim .sheet { animation: up .28s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
.sh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sh h2 { margin: 0; font-family: var(--display); font-size: 22px; line-height: 1.1; }
.close { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--raised); display: grid; place-items: center; flex: none; }
.close svg { width: 18px; height: 18px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--ink); padding: 4px; border-radius: 12px; }
.tabs button { min-height: 38px; border: 0; border-radius: 9px; background: none; font-weight: 700; font-size: 12.5px; color: var(--muted); }
.tabs button.sel { background: var(--raised); color: var(--text); }
.list { display: flex; flex-direction: column; gap: 6px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; background: var(--ink); border-radius: 12px; padding: 8px 12px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; min-height: 54px; }
.item b { font-size: 13.5px; }
.item span { font-size: 12px; color: var(--muted); grid-column: 1; }
.item .btn { grid-row: 1 / span 2; grid-column: 2; }
.empty { font-size: 13px; color: var(--muted); padding: 14px; text-align: center; background: var(--ink); border-radius: 12px; }
.pager { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.pocket { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; align-items: center; background: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 4px 6px 4px 12px; }
.pocket b { font-size: 14px; }
.pocket.nec { background: transparent; border-style: dashed; min-height: 46px; }
.pocket.nec output { color: var(--soft); }
.pocket span { font-size: 11.5px; color: var(--muted); grid-column: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pocket { min-width: 0; }
.stepper { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 4px; }
.stepper button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); font-size: 20px; font-weight: 700; display: grid; place-items: center; }
.stepper output { min-width: 44px; text-align: center; font-weight: 800; font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.coinbig { font-family: var(--display); font-weight: 800; font-size: 34px; display: flex; align-items: center; gap: 8px; }
.coinbig svg { width: 30px; height: 30px; color: var(--amber); }
.pack { min-height: 60px; border-radius: 12px; border: 1px solid var(--line); background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-weight: 800; font-size: 15px; }
.pack span { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { min-height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--ink); font-weight: 700; font-size: 12.5px; }
.seg button.sel { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, var(--ink)); }
.tbody { display: flex; flex-direction: column; gap: 10px; }
.tbody .cardv { animation: none; }
/* board */
.board { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(7, minmax(0, 1fr)); gap: 3px; padding: 5px; border-radius: 16px;
  background: linear-gradient(135deg, #F3EAD6, #E7DBC0); border: 3px solid #0B1424; box-shadow: 0 0 0 2px #C9A45C, 0 14px 30px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.5); }
.sp { position: relative; min-height: 0; border-radius: 7px; background: #FBF7EE; border: 1px solid rgba(11,20,36,.22); overflow: visible; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; color: #fff; box-shadow: 0 1px 0 rgba(11,20,36,.12); }
.sp .band { flex: 0 0 46%; background: var(--sc); border-radius: 6px 6px 0 0; display: grid; place-items: center; box-shadow: inset 0 -2px 0 rgba(0,0,0,.12); }
.sp .band svg { width: 22px; height: 22px; color: #fff; filter: drop-shadow(0 1px 0 rgba(0,0,0,.2)); }
.sp .sl { flex: 1; display: grid; place-items: center; font-size: 9.5px; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; color: #1B2433; text-align: center; padding: 0 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.sp.corner { background: var(--sc); border-color: rgba(11,20,36,.35); background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.1) 0 6px, transparent 6px 12px); }
.sp.corner .band { background: transparent; box-shadow: none; }
.sp.corner .band svg { width: 26px; height: 26px; }
.sp.corner .sl { color: #fff; font-size: 10px; text-shadow: 0 1px 0 rgba(0,0,0,.25); padding-bottom: 6px; }
.startarrow { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-style: normal; font-size: 7.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff; opacity: .9; }
.sp.corner.lightc .sl, .sp.corner.lightc .startarrow { color: #1B2433; text-shadow: none; }

    F.TYPE_ORDER.forEach((k) => { const m = t.match(new RegExp(NAMES[k] + '\\s*(\\d{1,2})\\s*/\\s*20')); if (m) scores[k] = +m[1]; });
    if (F.TYPE_ORDER.some((k) => scores[k] == null) || !/Money DNA/i.test(t)) return null;
    const head = t.match(/Money DNA · ([DISC])\b/);
    const ranked = F.TYPE_ORDER.slice().sort((x, y) => scores[y] - scores[x]);
    const type = head ? head[1] : ranked[0];
    const low = ranked.filter((k) => k !== type).pop();
    const nm = t.match(/Prepared for ([^·]{1,40}?) ·/);
    return { ok: true, type, low, scores, name: nm ? nm[1].trim() : '' };
  }
  async function readReport(file) {
    const I = app.intake;
    if (!file) return;
    if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) { I.report = { error: 'That isn’t a PDF. Upload the Money DNA report PDF from your email.' }; render(); return; }
    I.report = { reading: true }; render();
    try {
      const lib = await pdfLib();
      const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
      let text = '';
      for (let i = 1; i <= Math.min(doc.numPages, 8); i++) { const pg = await doc.getPage(i); const c = await pg.getTextContent(); text += ' ' + c.items.map((x) => x.str).join(' '); }
      I.report = parseReport(text) || { error: 'We couldn’t find your Money DNA scores in that file. Upload the full report PDF from your email.' };
    } catch (e) {
      I.report = { error: 'We couldn’t open that file. Try again, or pick your type yourself.' };
    }
    render();
  }

      return `<div class="sp${CORNERS.indexOf(i) >= 0 ? ' corner' : ''}${sp.strand === 'joy' ? ' lightc' : ''}${here ? ' here' : ''}" style="grid-area:${r}/${c};--sc:${SK[sp.strand].color}">

    }).join('');
    const left = F.turnsLeft(g), dcost = F.dreamCost(g);
    const warn = g.nearBroke || F.badDebt(g) > 3 * Math.max(1, m.income) || (g.cash <= 0 && m.flow < 0);

    let action;
    if (anim) action = `<div class="dierow"><div class="diewrap">${die3d(Object.assign({}, anim, { rx: anim.rx, ry: anim.ry, rz: anim.rz }))}<span class="dieshadow"></span></div><span class="fine" aria-live="polite">${anim.rolling ? 'Rolling\u2026' : 'You rolled ' + anim.die}</span></div>`;

  // ---------- turn ----------

  function newsBox(n) {
    if (n.kind === 'level') return `<div class="news" style="--c:${SK[n.strand].color}"><b>${n.code} reached: ${esc(n.name)}</b>Your ${SK[n.strand].name} strand grew. +3 coins.</div>`;

    if (n.kind === 'graceover') return `<div class="news" style="--c:var(--bad)"><b>The family safety net has ended</b>From now on, if you can\u2019t pay, you can go broke.</div>`;

  // ---------- while you were away: today's real headlines, then any missed days ----------

      <div class="panel"><div class="lines"><div><span>Stage reached</span><b>${stage}</b></div><div><span>Net worth change</span><b class="${ch >= 0 ? 'pos' : 'neg'}">${ch >= 0 ? '+' : ''}${S(ch)}</b></div></div></div>
      <div class="storyl">${(r.lines.length ? r.lines : ['Nothing major went wrong. You were lucky.']).slice(-5).map((l) => `<div>${esc(l)}</div>`).join('')}</div>
      ${r.comeback ? `<p class="fine" style="color:var(--amber)">Welcome back: +2 coins, and your next card is a lucky deal.</p>` : ''}

  // ---------- hooks that pull players forward ----------
  // The closest next achievement: a ready dream first, then the strand level nearest to done, then the dream.
  function nextGoal(g) {
    const dcost = F.dreamCost(g);
    if (g.dream && g.pots.dream >= dcost) return { title: 'Dream ready! Tap to make it real', text: g.dream.name, frac: 1, color: '#F5B841', sheet: 'dream', ready: true };
    let best = null;
    F.STRAND_ORDER.forEach((k) => {
      const L = F.LEVELS[k], lv = g.levels[k], last = k === 'protect' ? L.length - 1 : L.length;
      if (lv >= last) return;
      const pr = F.progress(g, k, lv);
      if (!best || pr.frac > best.frac) best = { title: L[lv].code + ' ' + L[lv].name, text: pr.text, frac: pr.frac, color: SK[k].color, sheet: 'strands' };
    });
    const dreamFrac = g.dream ? g.pots.dream / Math.max(1, dcost) : 0;
    if (g.dream && (!best || dreamFrac > best.frac)) return { title: g.dream.name, text: S(g.pots.dream) + ' of ' + S(dcost) + ' saved', frac: dreamFrac, color: '#F5B841', sheet: 'dream' };
    return best;
  }
  // One line about what tomorrow holds: an echo coming back, a calendar moment, a near goal, or the news.
  const ECHO_TEASE = {
    lemon: (e) => 'Something feels off about your ' + e.name.replace(/ \(.*\)$/, '') + '…',
    tip: () => 'Your hot stock tip is about to move. Up, or down?',
    cousin: () => 'Your cousin promised news about the money you lent.',
    askagain: () => 'Family may come asking again.',
    idle: () => 'The money you left in the bank is waiting on your decision.',
    waited: () => 'That deal you were researching won’t wait forever.',
    nocushion: () => 'Your all-in move left you with no cushion.',
    repaid: () => 'A payment plan is about to pay out.',
    trip: () => 'The card bill from your trip is on its way.',
  };
  function teaser() {
    const g = s(); if (!g || g.over) return '';
    const horizon = g.date + (g.retired ? 92 : 21) * 86400000;
    const e = (g.echoes || []).filter((x) => x.due <= horizon + 21 * 86400000).sort((a, b) => a.due - b.due)[0];
    if (e && ECHO_TEASE[e.kind]) return ECHO_TEASE[e.kind](e);
    const soon = (m, d) => { for (let t = g.date; t <= horizon; t += 86400000) { const x = new Date(t); if (x.getUTCMonth() === m && x.getUTCDate() === d) return true; } return false; };
    if (!g.retired && soon(11, 15)) return 'Your 13th month pay is almost here. What will you do with it?';
    if (soon(11, 24)) return 'The Christmas reunion is coming. Everyone will need something.';
    if (soon(5, 8) && g.kids.some((k) => !k.left)) return 'School opens soon. Enrollment, uniforms and supplies.';
    const ng = nextGoal(g);
    if (ng && ng.frac >= 0.6 && !ng.ready) return 'You’re close to ' + ng.title + '.';
    return 'Three new weeks of your life, and fresh headlines from the news.';
  }
  // A shareable image of your streak or legacy, drawn on a canvas (1080 x 1350, a 4:5 post).

  // A daily reminder for your calendar at this time of day: Google Calendar works everywhere; the .ics file works on the local version.
  function reminderTimes() {
    const now = new Date(); const t = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, now.getHours(), now.getMinutes() < 30 ? 30 : 0);
    if (now.getMinutes() >= 30) t.setHours(t.getHours() + 1);
    const end = new Date(t.getTime() + 10 * 60000);
    const z = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    return { start: t, gs: z(t), ge: z(end) };
  }
  function googleReminderUrl() {
    const r = reminderTimes();
    const q = new URLSearchParams({ action: 'TEMPLATE', text: 'Four Strands: play today’s 3 weeks', details: 'Keep your Money DNA streak alive. 2 minutes a day.', dates: r.gs + '/' + r.ge, recur: 'RRULE:FREQ=DAILY' });
    return 'https://calendar.google.com/calendar/render?' + q.toString();
  }
  function icsReminder() {

  // ---------- render ----------
  let lastSheet = null;
  // Before drawing: an ended game shows its ending, a waiting card is shown, and a new day opens on the board.
  function settleScreen() {
    const g = s(); if (!g || app.ui.anim || app.endPreview) return;
    if (g.over && (app.screen === 'home' || (app.screen === 'turn' && !g.card && !app.ui.result))) { app.screen = 'over'; app.ui = {}; return; }
    if (g.over) return;
    if (app.screen === 'home' && g.card) { app.screen = 'turn'; return; }

  }
  function render() {
    settleScreen();
    const views = { welcome: vWelcome, consent: vConsent, intake: vIntake, mirror: vMirror, home: vBoard, turn: vTurn, away: vAway, over: vOver, streak: vStreak, dayend: vDayEnd };
    const key = app.ui.sheet ? app.ui.sheet + (app.ui.tab || '') : null;
    app.ui.animate = key && key !== lastSheet && !(lastSheet && app.ui.sheet && lastSheet.indexOf(app.ui.sheet) === 0);
    lastSheet = key;
    root.innerHTML = (views[app.screen] || vWelcome)() + sheet() + (app.ui.toast ? `<div class="toast" role="status">${app.ui.toast}</div>` : '');
    bindDie();
    app.ui.cardAnim = false; // the card rises once, not on every redraw
    if (app.screen === 'streak' && app.ui.celebrate) { app.ui.celebrate = false; celebrate(); }
    if (app.ui.anim) app.ui.anim.justLanded = false; // the die bounces once when it lands
    const nm = document.getElementById('nm');
    if (nm) { nm.addEventListener('input', () => { app.intake.a.name = nm.value.trim(); const b = root.querySelector('[data-act="intakeNext"]'); if (b) b.disabled = false; }); }
    root.querySelectorAll('input[data-vol]').forEach((el) => {
      const out = el.parentNode.querySelector('output');
      el.addEventListener('input', () => { const v = +el.value; getCtx(); setVolume(el.dataset.vol, v); out.textContent = v ? v + '%' : 'Off'; if (el.dataset.vol === 'musicVol') { if (v > 0) musicActive(); else MUSIC.stop(); } });
      el.addEventListener('change', () => { if (el.dataset.vol === 'sfxVol' && +el.value > 0) SFX.good(); save(); });
    });
    const rf = document.getElementById('reportFile');
    if (rf) rf.addEventListener('change', () => readReport(rf.files && rf.files[0]));

  let toastTimer = null;
  function toast(html) { app.ui.toast = html; clearTimeout(toastTimer); toastTimer = setTimeout(() => { app.ui.toast = null; render(); }, 3200); }

  // Opening the game for the day: missed days run first, then today's headlines are applied.
  function openToday() {
    const g = s(); if (!g || g.over) return;
    const rep = F.openDay(g, today());
    const pages = [];
    const news = g.over ? null : F.applyNews(g, feed, today());
    if (news) news.forEach((n) => pages.push({ type: 'news', n }));
    if (rep && rep.days > 0) pages.push({ type: 'absence', rep });
    if (pages.length) { app.awayPages = pages; app.ui = { awayIdx: 0 }; app.screen = 'away'; }
  }
  // The feed arrives after first paint; show it as soon as the player is back on the home screen.
  function maybeNews() {
    const g = s(); if (!g || g.over || !feed || app.screen !== 'home' || g.card) return;
    const news = F.applyNews(g, feed, today());
    if (news) { app.awayPages = news.map((n) => ({ type: 'news', n })); app.ui = { awayIdx: 0 }; app.screen = 'away'; render(); }
  }
  let feed = app.feedCache || null;
  async function loadNews() {
    try {
      if (window.claude && window.claude.use) {
        const db = await window.claude.use('db'); if (!db) return;
        const snap = await db.doc('news/latest').get();
        if (snap.exists) { feed = snap.data(); app.feedCache = feed; maybeNews(); save(); }
        return;
      }
      // On moneydna.exoasia.org the site's own news service writes today's feed.
      if (!/^https?:$/.test(location.protocol)) return;
      const res = await fetch('/api/fourstrands/news', { cache: 'no-cache' });
      if (!res.ok) return;
      const data = await res.json();
      if (data && data.date && Array.isArray(data.items) && data.items.length) { feed = data; app.feedCache = feed; maybeNews(); save(); }
    } catch (e) { /* no feed today: the game plays on without news */ }
  }

  // ---------- rolling the die by hand ----------
  // The die stays in place. Dragging turns it with your finger; letting go spins it on, slowing smoothly onto the rolled face.
  const DIE = { drag: null };
  function dieRot() { return app.dieRot || { x: -20, y: 25, z: 0 }; }
  function cubeEl() { return root.querySelector('.cube'); }
  function setCube(r) { const c = cubeEl(); if (c) { c.style.transition = 'none'; c.style.transform = `rotateX(${r.x}deg) rotateY(${r.y}deg) rotateZ(${r.z}deg)`; } }
  function flickRoll() { const ang = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 0.6; rollWith(Math.cos(ang) * sp, Math.sin(ang) * sp); }
  function rollWith(vx, vy) {
    const g = s(); if (!g || g.card || app.ui.anim || g.over) return;
    dayLog(g);
    const r = F.startTurn(g); if (!r) return;
    app.dayLog.weeks++;
    const cur = Object.assign({}, dieRot());
    const a = { pos: r.from, die: r.roll, rolling: true, rx: cur.x, ry: cur.y, rz: cur.z };
    app.ui = { anim: a }; app.screen = 'home';
    render(); setCube(cur);
    SFX.diceRoll();
    const show = () => {
      if (app.s !== g) return; // a new life was started during the roll
      app.ui = { sum: r.sum, news: r.sum.news || [], cardAnim: true, roll: r.roll, space: F.BOARD[r.to] };
      if (g.over) { app.ui.result = { msg: g.over === 'legacy' ? 'You turned 100.' : 'You went broke.', tone: g.over === 'legacy' ? 'good' : 'bad', news: [] }; app.ui.lastTitle = 'The end'; }
      app.screen = 'turn'; SFX.card(); render();
    };
    // where the spin would naturally stop, then the nearest resting angle that shows the rolled face
    const speed = Math.max(0.6, Math.min(3, Math.hypot(vx, vy)));
    const spin = 540 + speed * 420;
    const dx = -vy / (Math.hypot(vx, vy) || 1) * spin, dy = vx / (Math.hypot(vx, vy) || 1) * spin;
    const [tx, ty] = FACE_ROT[r.roll];
    const near = (v, t) => t + 360 * Math.round((v - t) / 360);
    const to = { x: near(cur.x + dx, tx), y: near(cur.y + dy, ty), z: near(cur.z + (Math.random() - 0.5) * 120, 0) };
    const D = Math.min(1700, 900 + speed * 260), t0 = performance.now();
    const ease = (p) => 1 - Math.pow(1 - p, 3);
    let done = false;
    const landed = () => {
      if (done || app.s !== g) return; done = true;
      a.rx = to.x; a.ry = to.y; a.rz = to.z; a.rolling = false;
      app.dieRot = { x: ((to.x % 360) + 360) % 360, y: ((to.y % 360) + 360) % 360, z: 0 };
      render();
      let steps = 0;
      const hop = () => { if (app.s !== g) return; a.pos = (a.pos + 1) % F.BOARD.length; steps++; SFX.hop(steps); render(); if (steps < r.roll) setTimeout(hop, 190); else setTimeout(show, 420); };
      setTimeout(hop, 380);
    };
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { setCube(to); setTimeout(landed, 500); return; }
    const frame = (now) => {
      if (done) return;
      const p = Math.min(1, (now - t0) / D), k = ease(p);
      a.rx = cur.x + (to.x - cur.x) * k; a.ry = cur.y + (to.y - cur.y) * k; a.rz = cur.z + (to.z - cur.z) * k;
      setCube({ x: a.rx, y: a.ry, z: a.rz });
      if (p < 1) requestAnimationFrame(frame); else landed();
    };
    requestAnimationFrame(frame);
    setTimeout(landed, D + 200); // finishes even if the browser pauses animation frames
  }
  // hook up the die on the board after each render: drag to turn it, release to roll, tap or Enter for a quick roll
  function bindDie() {
    const el = document.getElementById('dieGrab'); if (!el) return;
    const start = (e) => {
      if (app.ui.anim) return;
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (x) {}
      const r = dieRot();
      DIE.drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, r0: { x: r.x, y: r.y, z: r.z }, pts: [{ x: e.clientX, y: e.clientY, t: performance.now() }], moved: 0 };
      el.classList.add('grabbing');
    };
    const move = (e) => {
      const d = DIE.drag; if (!d || d.id !== e.pointerId) return;
      const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
      d.moved = Math.max(d.moved, Math.hypot(dx, dy));
      d.pts.push({ x: e.clientX, y: e.clientY, t: performance.now() }); if (d.pts.length > 8) d.pts.shift();
      app.dieRot = { x: d.r0.x - dy * 0.9, y: d.r0.y + dx * 0.9, z: d.r0.z };
      setCube(app.dieRot);
    };
    const end = (e) => {
      const d = DIE.drag; if (!d || d.id !== e.pointerId) return;
      DIE.drag = null; el.classList.remove('grabbing');
      musicActive();
      if (d.moved < 8) { flickRoll(); return; } // a tap rolls with a random flick
      const now = performance.now(), recent = d.pts.filter((p) => now - p.t < 120), first = recent[0] || d.pts[0], last = d.pts[d.pts.length - 1];
      const dt = Math.max(16, last.t - first.t);
      const vx = (last.x - first.x) / dt, vy = (last.y - first.y) / dt;
      if (Math.hypot(vx, vy) < 0.15) { const ang = Math.atan2(last.y - d.y0, last.x - d.x0); rollWith(Math.cos(ang) * 0.7, Math.sin(ang) * 0.7); return; } // a slow drag still rolls, gently
      rollWith(vx, vy);
    };
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', () => { DIE.drag = null; el.classList.remove('grabbing'); });
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flickRoll(); } });
  }

  function chooseCard(id) {
    const g = s(), c = g.card; if (!c) return;
    const opt = c.choices.find((x) => x.id === id), nw0 = F.netWorth(g);
    const r = F.choose(g, id); if (!r) return;
    noteChoice(g, c, opt, F.netWorth(g) - nw0, (app.ui.news || []).concat(r.news || []));
    r.news = (app.ui.news || []).concat(r.news || []).slice(0, 2);
    app.ui.result = r; app.ui.lastTitle = c.title; app.ui.lastStrand = c.strand; app.ui.news = [];
    if ((r.news || []).some((n) => n.kind === 'level' || n.kind === 'blind' || n.kind === 'mastered')) SFX.level(); else if (r.tone === 'good') SFX.good(); else if (r.tone === 'bad') SFX.bad(); else SFX.tap();
  }
  function oops(err) {
    try { console.error(err); } catch (e) {}
    app.ui = { toast: `<b>Something went wrong</b>${esc((err && err.message) || String(err))}. Please send Mack a screenshot.` };
    try { if (s() && s().card) app.screen = 'turn'; render(); } catch (e) {}
  }
  window.addEventListener('error', (e) => oops(e.error || e.message));
  root.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act]; if (!fn) return;
    if (el.dataset.act === 'closeBg' && e.target !== el) return;
    try { fn(el.dataset.arg, e); render(); } catch (err) { oops(err); }
    musicActive(); // browsers allow sound only after a tap
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && app.ui.sheet) { app.ui.sheet = null; render(); }
    if (e.key === 'Enter' && app.screen === 'intake') { const b = root.querySelector('[data-act="intakeNext"]'); if (b && !b.disabled) b.click(); }
  });

  // Fix up a loaded save so it never opens on a half-finished screen.
  function tidy() {
    if (app.intake && app.intake.report && app.intake.report.reading) app.intake.report = null; // a reload interrupted reading a report
    if (app.screen === 'dayend' && !app.recap) app.screen = 'home';
    if (app.screen === 'streak' && !app.streakShow) app.screen = 'home';
    if (app.s) F.upgradeSave(app.s); // older saves get any newer fields
    // older saves used on/off switches: carry "off" over to the sliders
    if (app.musicVol == null && app.music === false) app.musicVol = 0;
    if (app.sfxVol == null && app.sound === false) app.sfxVol = 0;
    if (app.screen === 'turn' && !(s() && s().card)) app.screen = 'home';
    if (app.screen === 'home' && s() && s().card && !s().over) app.screen = 'turn'; // never strand a waiting card
    if (app.screen === 'away' && !(app.awayPages && app.awayPages.length)) app.screen = 'home';
  }
  async function start() {
    tidy();
    previewMode = /^#(streak|day|broke|legacy)$/.test(location.hash);
    if (CLOUD && !previewMode) {
      const was = app.screen; app.screen = 'welcome'; render(); // "Checking your account…" until we know
      await checkAccount();
      if (signedOutCloud() && !app.guest) { app.screen = 'welcome'; app.ui = {}; }
      else if (app.screen === 'welcome') app.screen = was;
    }
    if (location.hash === '#streak') { previewStreak(); render(); loadNews(); return; }
    if (location.hash === '#day') { app.recap = demoRecap(); app.ui = {}; app.screen = 'dayend'; render(); return; }
    if (app.screen === 'dayend' && !app.recap) app.screen = s() ? 'home' : 'welcome';
    if (location.hash === '#broke' || location.hash === '#legacy') { app.endPreview = location.hash.slice(1); app.ui = {}; app.screen = 'over'; render(); return; }
    if (app.endPreview) { app.endPreview = null; if (app.screen === 'over' && !(s() && s().over)) app.screen = s() ? 'home' : 'welcome'; }
    if (app.screen === 'home') openToday();
    render();
    loadNews();
  }
  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ app }));
    window.claude.hot.ready ? window.claude.hot.ready((snap) => { if (snap && snap.app) app = snap.app; start(); }) : start();
  } else start();
})();
</script>
